name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── 构建验证：跨 Node 版本 + 跨 Vite 版本确保产物正确 ───
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
        vite-version: [4, 5, 6, 7, 8]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 安装指定 Vite 版本
        run: pnpm add -D vite@${{ matrix.vite-version }}

      - run: pnpm build

      - name: 验证构建产物结构
        run: |
          test -f dist/index.mjs  || { echo "❌ 缺少 ESM 产物";  exit 1; }
          test -f dist/index.cjs  || { echo "❌ 缺少 CJS 产物";  exit 1; }
          test -f dist/index.d.mts || { echo "❌ 缺少 ESM 类型声明"; exit 1; }
          test -f dist/index.d.cts || { echo "❌ 缺少 CJS 类型声明"; exit 1; }
          echo "✅ 构建产物完整"
